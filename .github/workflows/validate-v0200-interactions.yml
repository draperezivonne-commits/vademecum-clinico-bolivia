name: Validar aplicación e interacciones

on:
  push:
    branches: [main]
    paths:
      - 'docs/data/interaction_kb_v0200.js'
      - 'docs/data/interaction_engine_v0200.js'
      - 'docs/data/interaction_sources_v0200.json'
      - 'docs/data/interaction_*.js'
      - 'docs/data/catalog_patch_*.js'
      - 'docs/data/app-version.json'
      - 'docs/data/catalog-version.json'
      - 'docs/index.html'
      - 'docs/config.js'
      - 'docs/sw.js'
      - 'docs/manifest.webmanifest'
      - '.github/workflows/validate-v0200-interactions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxis JavaScript
        run: |
          node --check docs/data/interaction_kb_v0200.js
          node --check docs/data/interaction_engine_v0200.js
          node --check docs/data/catalog_patch_v02014.js
          node --check docs/data/catalog_patch_v02015.js
          node --check docs/data/catalog_patch_v02016.js
          node --check docs/data/interaction_alert_noopiram_v02016.js
          node --check docs/data/feature_patch_v0204.js
          node --check docs/sw.js
          node --check docs/config.js

      - name: Validar base histórica de interacciones
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('docs/data/interaction_kb_v0200.js','utf8');
          const sandbox={window:{}};
          vm.createContext(sandbox);
          vm.runInContext(code,sandbox);
          const k=sandbox.window.VCB_INTERACTION_KB;
          if(!k) throw new Error('VCB_INTERACTION_KB no se creó');
          const sourceCount=Object.keys(k.sources||{}).length;
          const groupCount=Object.keys(k.groups||{}).length;
          if(sourceCount!==19) throw new Error(`Fuentes base: ${sourceCount}, esperado 19`);
          if(groupCount!==65) throw new Error(`Grupos base: ${groupCount}, esperado 65`);
          if((k.class_rules||[]).length!==59) throw new Error(`Reglas clase base: ${k.class_rules.length}, esperado 59`);
          if((k.exact_rules||[]).length!==64) throw new Error(`Reglas exactas base: ${k.exact_rules.length}, esperado 64`);
          const ex=(a,b)=>k.exact_rules.find(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a));
          if(!ex('Ciprofloxacino','Tizanidina')?.nivel.toLowerCase().includes('contra')) throw new Error('Falta ciprofloxacino+tizanidina contraindicada');
          if(!ex('Allopurinol','Azatioprina')) throw new Error('Falta allopurinol+azatioprina');
          if(!ex('Linezolid','Sertralina')) throw new Error('Falta linezolid+sertralina');
          const cl=(a,b)=>k.class_rules.find(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a));
          for(const pair of [['NITRATES','PDE5'],['OPIOIDS','BENZOS'],['CARBAPENEMS','VALPROATES'],['DOACS','STRONG_CYP3A_INDUCERS'],['LEVOTHYROXINE','CATIONS']]){
            if(!cl(...pair)) throw new Error('Falta regla de clase '+pair.join('+'));
          }
          NODE

      - name: Validar expansión ALERTEX y NOOPIRAM
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const files=[
            'docs/data/interaction_kb_v0200.js',
            'docs/data/interaction_audit_v0208.js',
            'docs/data/interaction_migraine_v0209.js',
            'docs/data/interaction_neuro_v02011.js',
            'docs/data/interaction_global_v02012.js',
            'docs/data/interaction_global_v02013.js',
            'docs/data/interaction_global_fix_v02013.js',
            'docs/data/interaction_alert_noopiram_v02016.js'
          ];
          const sandbox={window:{},console};
          vm.createContext(sandbox);
          for(const file of files) vm.runInContext(fs.readFileSync(file,'utf8'),sandbox,{filename:file});
          const k=sandbox.window.VCB_INTERACTION_KB;
          if(k.version!=='0.20.16') throw new Error('La base acumulativa no terminó en v0.20.16');
          const ex=id=>k.exact_rules.find(r=>r.id===id);
          const cl=id=>k.class_rules.find(r=>r.id===id);
          for(const id of [
            'ALERTEX-PHENYTOIN-02016','ALERTEX-CARBAMAZEPINE-02016','ALERTEX-HALOPERIDOL-02016',
            'ALERTEX-CLOPIDOGREL-02016','ALERTEX-WARFARIN-02016','NOOPIRAM-HALOPERIDOL-02016'
          ]) if(!ex(id)) throw new Error('Falta regla exacta '+id);
          for(const id of [
            'ALERTEX-NOOPIRAM-02016','ALERTEX-BP-02016','ALERTEX-STIMULANTS-02016',
            'NOOPIRAM-ANTIPLATELET-02016','NOOPIRAM-ANTICOAG-02016','NOOPIRAM-NSAID-02016',
            'NOOPIRAM-AED-02016','NOOPIRAM-THYROID-02016'
          ]) if(!cl(id)) throw new Error('Falta regla de clase '+id);
          if(!k.groups.MODAFINIL?.includes('Modafinilo')) throw new Error('Grupo MODAFINIL incompleto');
          if(!k.groups.PIRACETAM?.includes('Piracetam')) throw new Error('Grupo PIRACETAM incompleto');
          if((k.class_rules||[]).length<138) throw new Error('Cobertura por clases inferior a la esperada: '+k.class_rules.length);
          if((k.exact_rules||[]).length<84) throw new Error('Cobertura exacta inferior a la esperada: '+k.exact_rules.length);
          console.log({version:k.version,sources:Object.keys(k.sources).length,groups:Object.keys(k.groups).length,classRules:k.class_rules.length,exactRules:k.exact_rules.length});
          NODE

      - name: Validar activación y versiones PWA
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const configCode=fs.readFileSync('docs/config.js','utf8');
          const sandbox={window:{}};
          vm.createContext(sandbox);
          vm.runInContext(configCode,sandbox);
          const cfg=sandbox.window.VCB_CONFIG;
          if(!cfg?.appVersion) throw new Error('appVersion ausente en config.js');
          const app=JSON.parse(fs.readFileSync('docs/data/app-version.json','utf8'));
          const cat=JSON.parse(fs.readFileSync('docs/data/catalog-version.json','utf8'));
          if(app.latestVersion!==cfg.appVersion) throw new Error(`app-version.json=${app.latestVersion} y config.js=${cfg.appVersion}`);
          if(cat.appVersion!==cfg.appVersion) throw new Error(`catalog-version.json appVersion=${cat.appVersion} y config.js=${cfg.appVersion}`);
          if(cfg.interactionVersion!=='0.20.16') throw new Error('config interactionVersion no es 0.20.16');
          const sw=fs.readFileSync('docs/sw.js','utf8');
          if(!sw.includes(`vcb-shell-${cfg.appVersion}`)) throw new Error('CACHE_NAME no coincide con appVersion');
          const index=fs.readFileSync('docs/index.html','utf8');
          if(!index.includes('interaction_kb_v0200.js?v=0.20.0')) throw new Error('Base histórica de interacciones no está cargada en index');
          if(!index.includes('interaction_engine_v0200.js?v=0.20.0')) throw new Error('Motor histórico de interacciones no está cargado en index');
          if(index.includes('interaction_engine_v0194.js')) throw new Error('Motor v0.19.4 todavía activo');
          if(!index.includes('feature_patch_v0204.js?v=0.20.16')) throw new Error('index no carga la cadena v0.20.16');
          if(!sw.includes('catalog_patch_v02016.js?v=0.20.16')) throw new Error('PWA no precachea ALERTEX v0.20.16');
          if(!sw.includes('interaction_alert_noopiram_v02016.js?v=0.20.16')) throw new Error('PWA no precachea interacciones v0.20.16');
          console.log({appVersion:cfg.appVersion,catalogEnrichmentVersion:cfg.catalogEnrichmentVersion,interactionVersion:cfg.interactionVersion});
          NODE

name: Preparar PWA para GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Vademecum_Clinico_Bolivia_v0.19.0_PWA_NAMECHEAP.zip'
      - '.github/workflows/preparar-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer PWA en docs
        run: |
          rm -rf docs
          mkdir -p docs
          unzip -q Vademecum_Clinico_Bolivia_v0.19.0_PWA_NAMECHEAP.zip -d docs
          touch docs/.nojekyll

      - name: Guardar archivos web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Publicar PWA Vademécum Clínico Bolivia v0.19.0"
          git push
